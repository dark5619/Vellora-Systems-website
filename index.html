    <link rel="icon" type="image/png" href="/assets/Shared-Brand/primary-home/symbol.png" />

    <script>
      // Start the above-the-fold hero plate early, but only on the route that shows it.
      (function () {
        if (location.pathname !== '/') return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.setAttribute('fetchpriority', 'high');
        l.setAttribute('imagesrcset', '/assets/01-Home/backgrounds/hero-with-v-w836.webp 836w, /assets/01-Home/backgrounds/hero-with-v.webp 1672w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      })();
    </script>
  </head>
